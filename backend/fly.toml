app = "boostrank"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8010"

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1